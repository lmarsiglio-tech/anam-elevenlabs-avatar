<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElevenLabs + Anam Avatar</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #1a1a2e; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: flex; flex-direction: column; align-items: center;
        justify-content: center; min-height: 100vh; padding: 20px;
      }
      h1 { font-size: 1.4rem; margin-bottom: 20px; color: #00ff88; }
      #video-container {
        width: 480px; height: 480px; border-radius: 16px;
        overflow: hidden; background: #0f0f23;
        border: 2px solid #333; margin-bottom: 20px;
      }
      #avatar-video { width: 100%; height: 100%; object-fit: cover; }
      #status { font-size: 0.9rem; color: #888; margin-bottom: 16px; }
      button {
        padding: 14px 36px; font-size: 1rem; border: none;
        border-radius: 8px; cursor: pointer; font-weight: 600;
      }
      #start-btn { background: #00ff88; color: #1a1a2e; }
      #start-btn:hover { background: #00cc6a; }
      #start-btn:disabled { background: #555; color: #999; cursor: not-allowed; }
      #stop-btn { background: #ff4444; color: #fff; display: none; margin-left: 10px; }
      .buttons { display: flex; gap: 10px; }
      #error { color: #ff4444; margin-top: 16px; font-size: 0.85rem; max-width: 480px; text-align: center; }
    </style>
  </head>
  <body>
    <h1>ElevenLabs + Anam Avatar (Server-Side)</h1>
    <div id="video-container">
      <video id="avatar-video" autoplay playsinline></video>
    </div>
    <p id="status">Disconnesso — premi Start per iniziare</p>
    <div class="buttons">
      <button id="start-btn">🎤 Start Conversation</button>
      <button id="stop-btn">⏹ Stop</button>
    </div>
    <p id="error"></p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
